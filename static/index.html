<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muster · Attendance</title>
<meta name="description" content="Daily attendance register for HR: who is in, who is late, and who still needs marking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B5A3B'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h8' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('muster.theme');if(t)document.documentElement.dataset.theme=t;if(localStorage.getItem('muster.rail')==='1')document.documentElement.classList.add('rail')}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 11h14M9 16h14M9 21h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <span class="brand-name label">Muster</span>
    </div>
    <nav id="nav"></nav>
    <div class="side-card" id="sideCard"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="col">
    <header class="topbar">
      <button class="icon-btn" id="hamburger" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true" data-tip="Toggle sidebar  ["></button>
      <button class="search-trigger" id="searchBtn" aria-label="Search employees and pages (Ctrl+K)"></button>
      <div class="top-right">
        <span class="today-label" id="todayLabel"></span>
        <span class="sync" id="sync" role="status" aria-live="polite"></span>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark theme"></button>
        <span class="role-chip"><span class="avatar av-0" aria-hidden="true">HR</span><span class="role-text"><b>HR Admin</b><small>Signed-in role</small></span></span>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="drawer" id="drawer" aria-labelledby="drawerTitle"></dialog>
<dialog class="palette" id="palette" aria-label="Command search"></dialog>
<dialog class="modal" id="keys" aria-labelledby="keysTitle"></dialog>
<script src="/static/app.js"></script>
</body>
</html>
